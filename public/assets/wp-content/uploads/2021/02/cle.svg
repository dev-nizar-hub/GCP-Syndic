<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 75 75" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:10;">
  <!-- Key icon -->
  <!-- Key ring / circle -->
  <circle cx="22" cy="30" r="16" style="fill:none;stroke:#000;stroke-width:2.5px;"/>
  <!-- Key shaft -->
  <line x1="33" y1="30" x2="68" y2="30" style="stroke:#000;stroke-width:2.5px;stroke-linecap:round;"/>
  <!-- Key teeth -->
  <line x1="55" y1="30" x2="55" y2="40" style="stroke:#000;stroke-width:2.5px;stroke-linecap:round;"/>
  <line x1="63" y1="30" x2="63" y2="38" style="stroke:#000;stroke-width:2.5px;stroke-linecap:round;"/>
  <!-- Key hole -->
  <circle cx="18" cy="29" r="4" style="fill:none;stroke:#000;stroke-width:2px;"/>
</svg>
